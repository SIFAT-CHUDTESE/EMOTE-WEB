services:
  - type: web
    name: ff-emote-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore          # closest to BD/SEA game servers
    plan: starter              # upgrade to standard for always-on
    envVars:
      - key: PORT
        value: "5000"
      - key: SESSION_SECRET
        generateValue: true    # auto-generated random secret
    healthCheckPath: /api/health
    autoDeploy: true           # redeploy on every git push
